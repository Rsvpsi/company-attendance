<title>Dashboard</title>
<link rel="stylesheet" href="css/style.css">

<style>
.dashboard{
    width:90%;
    margin:auto;
    padding:30px;
}

.cards{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    width:220px;
    background:white;
    padding:25px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    margin:10px;
}

.card h2{
    color:#0d6efd;
}

.menu{
    margin-top:40px;
}

.menu a{
    display:inline-block;
    width:220px;
    text-align:center;
    background:#0d6efd;
    color:white;
    padding:15px;
    margin:10px;
    text-decoration:none;
    border-radius:5px;
}

.menu a:hover{
    background:#084298;
}
</style>

</head>
